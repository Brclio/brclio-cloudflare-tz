name: Verify and package
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run build:tutorial
      - run: npm run check
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: brclio-edge-deploy
          path: |
            dist/_worker.js
            dist/brclio-edge-pages.zip
            dist/build-manifest.json
            docs/tutorial.html
            docs/github-deploy.html
          if-no-files-found: error
